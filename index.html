<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display info</title>
    <meta
      name="description"
      content="See your monitor and display information in the browser: resolution, system scale (DPR), refresh rate, color depth, color gamut, and more."
    />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="screen-info" />
    <meta property="og:title" content="Display info" />
    <meta
      property="og:description"
      content="See your monitor and display information in the browser: resolution, system scale (DPR), refresh rate, color depth, color gamut, and more."
    />
    <meta property="og:url" content="https://mydisplay.info/" />
    <meta property="og:image" content="https://mydisplay.info/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      property="og:image:alt"
      content="screen-info display information page"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mydisplay.info/og-image.jpg" />
    <meta name="twitter:title" content="Display info" />
    <meta
      name="twitter:description"
      content="See your monitor and display information in the browser: resolution, system scale (DPR), refresh rate, color depth, color gamut, and more."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="dist/script.js" defer></script>
  </head>
  <body>
    <div class="bg-glow"></div>

    <main class="wrap">
      <header class="hero">
        <span class="badge"><span class="dot"></span> Updating live</span>
        <h1>Your display <span class="grad">data</span></h1>
        <p class="sub">
          All available information about your screen, read in the browser.
        </p>
      </header>

      <section class="grid" id="grid"></section>

      <footer class="foot">
        <span id="ua">—</span>
      </footer>
    </main>
  </body>
</html>
