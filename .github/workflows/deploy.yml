name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # HUSKY=0 skips the husky "prepare" hook install, which is irrelevant in CI.
      - run: npm ci
        env:
          HUSKY: 0

      - run: npm run build

      # Assemble only the files the site actually needs (no node_modules, no src).
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -r dist _site/dist
          # Social preview image (optional): copy if present.
          cp og-image.jpg _site/ 2>/dev/null || echo "og-image.jpg not found, skipping social preview image"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
